<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WisataPass – Tourist Attraction Tickets</title>

  <!-- Inter Variable Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/animations.css" />
  <link rel="stylesheet" href="/css/mobile.css" />
  <link rel="stylesheet" href="/css/fixes.css" />
  <link rel="stylesheet" href="/css/scroll-fix.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎫</text></svg>" />
</head>
<body>
  <div id="app">
    <div id="page-loading" class="page-loading" aria-label="Loading WisataPass" role="status">
      <div class="loading-logo">
        <svg class="loading-logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="url(#lg)"/>
          <path d="M8 16h4l2-5 4 10 2-5h4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <defs><linearGradient id="lg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
            <stop stop-color="#60a5fa"/><stop offset="1" stop-color="#3b82f6"/>
          </linearGradient></defs>
        </svg>
        <span class="loading-brand">WisataPass</span>
      </div>
      <div class="loading-bar" role="progressbar"><div class="loading-bar-fill"></div></div>
      <span class="loading-label">Loading…</span>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="false"></div>

  <!-- Confirm modal -->
  <div id="confirm-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="modal-box modal-sm">
      <div class="modal-icon" id="confirm-icon" aria-hidden="true"></div>
      <h3 class="modal-title" id="confirm-title">Are you sure?</h3>
      <p class="modal-message" id="confirm-message"></p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="confirm-cancel-btn">Cancel</button>
        <button class="btn btn-danger" id="confirm-ok-btn">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Sidebar overlay (mobile) -->
  <div id="sidebar-overlay" class="sidebar-overlay" aria-hidden="true"></div>

  <!-- Bottom Navigation (mobile only – populated by JS) -->
  <nav class="bottom-nav" id="bottom-nav" aria-label="Mobile navigation">
    <div class="bottom-nav-inner" id="bottom-nav-inner"></div>
  </nav>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
